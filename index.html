<style>

 function samp(ks,t){let i=0;while(i<ks.length-2&&t>ks[i+1][0])i++;const k0=ks[i],k1=ks[i+1],dt=k1[0]-k0[0],u=Math.min(1,Math.max(0,(t-k0[0])/dt));
  const km=ks[Math.max(0,i-1)],kp=ks[Math.min(ks.length-1,i+2)],o=[],u2=u*u,u3=u2*u,a=2*u3-3*u2+1,b=u3-2*u2+u,c=-2*u3+3*u2,d=u3-u2;
  for(let q=1;q<8;q++){const m0=i>0?(k1[q]-km[q])/(k1[0]-km[0]):(k1[q]-k0[q])/dt,m1=i+2<ks.length?(kp[q]-k0[q])/(kp[0]-k0[0]):(k1[q]-k0[q])/dt;o.push(a*k0[q]+b*dt*m0*.75+c*k1[q]+d*dt*m1*.75)}return o}
 function pose(t){const s=P.SC.find(x=>t>=x[0]&&t<x[1])||P.SC[P.SC.length-1],p=samp(s[2],Math.min(t,s[1]));const walk=t>=P.walk[0]&&t<P.walk[1]?1:0;
  p[1]+=walk*.012*Math.sin(t*5.4);p[0]+=walk*.006*Math.sin(t*2.7);return p}
 function setDoor(o,a,pref){if(!o||!o.lp)return;const hor=Math.abs(o.z1-o.z2)<1e-6,pz=hor?[0,-1]:[-1,0],sg=(pref[0]*pz[0]+pref[1]*pz[1])>=0?1:-1;o.lp.rotation.y=sg*a}
 const fadeAt=t=>{let f=0;for(const [c,w] of P.FADES)f=Math.max(f,1-Math.abs(t-c)/w);return Math.max(0,Math.min(1,f))};
 function overlay(c,W,H,t){
  const g=c.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.26)');c.fillStyle=g;c.fillRect(0,0,W,H);

   const bw=Math.max(w1,w2)+pad*2,bh=fs*1.95+pad,x=W*.04,y=H*.84-bh;c.fillStyle='rgba(12,18,24,.58)';c.beginPath();c.moveTo(x+14,y);c.arcTo(x+bw,y,x+bw,y+bh,14);c.arcTo(x+bw,y+bh,x,y+bh,14);c.arcTo(x,y+bh,x,y,14);c.arcTo(x,y,x+bw,y,14);c.closePath();c.fill();
   c.fillStyle='#fff';c.textBaseline='alphabetic';c.font='700 '+fs+'px "Segoe UI",Arial,sans-serif';c.fillText(cp[2],x+pad,y+pad+fs*.8);c.fillStyle='rgba(255,255,255,.82)';c.font='400 '+fs*.62+'px "Segoe UI",Arial,sans-serif';c.fillText(cp[3],x+pad,y+pad+fs*1.55);c.restore()}
  const card=(a,t1,t2)=>{c.save();c.globalAlpha=a;c.textAlign='center';c.fillStyle='#fff';c.shadowColor='rgba(0,0,0,.6)';c.shadowBlur=H*.02;c.font='700 '+H*.062+'px "Segoe UI",Arial,sans-serif';c.fillText(t1,W/2,H*.47);c.font='500 '+H*.03+'px "Segoe UI",Arial,sans-serif';c.fillText(t2,W/2,H*.47+H*.065);c.restore()};
  if(t<3.8)card(Math.max(0,Math.min(1,(t-.3)/.6,(3.8-t)/.6)),P.title,CREDIT);

  else if(t>=3.8){c.save();c.globalAlpha=.75;c.textAlign='right';c.fillStyle='#fff';c.shadowColor='rgba(0,0,0,.7)';c.shadowBlur=H*.008;c.font='600 '+H*.02+'px "Segoe UI",Arial,sans-serif';c.fillText(CREDIT,W*.965,H*.07);c.restore()}
  const f=fadeAt(t);if(f>0){c.fillStyle='rgba(0,0,0,'+f.toFixed(3)+')';c.fillRect(0,0,W,H)}}
 function start(kind){if(st.on)return;P=PROG[kind];
  st.saved={mode:MODE,opt:OPT,grill:GRILL.target};if(kind==='int'&&!OPT){OPT=true;suiteButton()}
  GRILL.target=0;GRILL.t=0;GRILL.leaves.forEach(l=>l.rotation.y=0);grillButton();
  P.DR.forEach(d=>setDoor(d[0],0,d[3]));
  setMode('ext');apply();st.T=0;st.last=performance.now();st.on=true;st.pause=false;st.evDone=P.EV.map(()=>false);
  document.body.classList.add('touring');bar.hidden=false;bp.textContent='Pause'}
 function stop(){if(!st.on)return;st.on=false;
  P.DR.forEach(d=>setDoor(d[0],0,d[3]));
  GRILL.target=st.saved.grill;grillButton();if(st.saved.opt!==OPT){OPT=st.saved.opt;suiteButton()}
  document.body.classList.remove('touring');bar.hidden=true;cam.fov=45;
  const m=st.saved.mode;if(m==='gp'||m==='fp'||m==='rp')setPlanMode(m);else setMode(m);apply();rs()}
 function step(){const n=performance.now(),dt=Math.min(.1,(n-st.last)/1000);st.last=n;if(!st.pause)st.T+=dt;const t=st.T;
  if(t>=P.END){stop();return}
  const p=pose(t);cam.position.set(p[0],p[1],p[2]);cam.lookAt(p[3],p[4],p[5]);if(Math.abs(cam.fov-p[6])>.01){cam.fov=p[6];cam.updateProjectionMatrix()}
  P.EV.forEach((e,i)=>{if(!st.evDone[i]&&t>=e[0]){st.evDone[i]=true;e[1]()}});
  P.DR.forEach(d=>{const u=Math.max(0,Math.min(1,(t-d[1])/d[2]));setDoor(d[0],1.9*u*u*(3-2*u),d[3])});
  const mm=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');info.textContent=mm(t)+' / '+mm(P.END)}
 function post(){const dpr=Math.min(devicePixelRatio,2),w=Math.round(v.clientWidth*dpr),h=Math.round(v.clientHeight*dpr);if(tcv.width!==w||tcv.height!==h){tcv.width=w;tcv.height=h}tx.clearRect(0,0,w,h);overlay(tx,w,h,st.T)}
 bp.onclick=()=>{st.pause=!st.pause;bp.textContent=st.pause?'Resume':'Pause'};bs.onclick=stop;
 addEventListener('keydown',e=>{if(e.key==='Escape')stop()});
 return {get on(){return st.on},start,stop,step,post};
})();
